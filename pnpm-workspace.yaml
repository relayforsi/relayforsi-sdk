packages:
  - "packages/*"
  - "tools/*"

# Only install versions published at least a day ago.
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true

# Vitest's browser mocker expects msw 2; the tests use msw 3 in Node only.
peerDependencyRules:
  allowedVersions:
    "@vitest/mocker>msw": "3"
