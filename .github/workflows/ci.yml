name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The OpenAPI document the types are generated from. Override with a repository variable.
  RELAYFOR_OPENAPI_URL: ${{ vars.RELAYFOR_OPENAPI_URL || 'https://relayfor.si/api/project/v1/openapi.json' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails if the API changed since openapi.lock.json was accepted.
      - run: pnpm generate:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - run: node scripts/pack-files.mjs
      # Nothing tracked or published may name the team behind the API.
      - run: node scripts/public-names.mjs
      - run: pnpm format:check

  # Type-checks the published package with supported TypeScript versions.
  consumers:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && pnpm build
      - run: scripts/check-consumers.sh

  # Runs the packed package on each supported runtime.
  runtimes:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node22, node24, bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.runtime == 'node24' && '24' || '22' }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && pnpm build
      - name: Install the packed tarball into a fresh project
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          (cd packages/sdk && pnpm pack --pack-destination "$RUNNER_TEMP/smoke")
          cp scripts/smoke.mjs "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          echo '{ "name": "smoke", "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund ./relayfor.si-*.tgz
      - name: Smoke
        working-directory: ${{ runner.temp }}/smoke
        run: |
          case "${{ matrix.runtime }}" in
            bun) bun smoke.mjs ;;
            deno) deno run --allow-read --allow-env smoke.mjs ;;
            *) node smoke.mjs && node -e 'require("relayfor.si"); console.log("require(esm) ok")' ;;
          esac
