name: release

# release-please opens a release PR from conventional commits. Merging it creates the release,
# and publishing runs in the protected `npm` environment using npm trusted publishing.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELAYFOR_OPENAPI_URL: ${{ vars.RELAYFOR_OPENAPI_URL || 'https://relayfor.si/api/project/v1/openapi.json' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Trusted publishing requires npm 11 (Node 24).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Publish the released packages
        env:
          PATHS: ${{ needs.release-please.outputs.paths_released }}
        run: |
          for path in $(echo "$PATHS" | jq -r '.[]'); do
            version=$(node -p "require('./$path/package.json').version")
            # Prereleases are published under the `next` tag.
            tag=$([[ "$version" == *-* ]] && echo next || echo latest)
            (cd "$path" && npm publish --access public --tag "$tag")
          done
