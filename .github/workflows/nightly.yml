name: nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects API changes not yet reflected in openapi.lock.json.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:check
      - run: pnpm typecheck && pnpm test

  # Runs the SDK against the live API.
  live:
    runs-on: ubuntu-latest
    environment: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && pnpm build
      - run: node packages/sdk/scripts/live-smoke.ts
        env:
          RELAYFOR_CI_SECRET_KEY: ${{ secrets.RELAYFOR_CI_SECRET_KEY }}
          RELAYFOR_CI_CREATOR: ${{ vars.RELAYFOR_CI_CREATOR }}
          RELAYFOR_CI_WEBHOOK_URL: ${{ vars.RELAYFOR_CI_WEBHOOK_URL }}
